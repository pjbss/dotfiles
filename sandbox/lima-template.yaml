# lima-template.yaml
#
# Base Lima VM config for dotfiles sandbox tasks (issue 003). An Ubuntu VM
# with the task's worktree mounted read-write, plus read-only host
# credential mounts (issue 004: GitHub CLI auth, AWS config/SSO cache --
# no git credentials or SSH keys, by PRD design), plus Docker and the
# Claude Code/GitHub CLI/GitHub Copilot CLIs provisioned unconditionally
# on every VM (issue 008's "Docker available in every spawned VM"
# acceptance criterion, extended to cover the agent CLIs).
#
# ~/.claude and ~/.copilot are deliberately NOT mounted from the host,
# unlike ~/.config/gh and ~/.aws: almost everything under those two
# directories (transcripts, memory, todos, shell-snapshots, session
# state/caches, Copilot's session-store.db) is runtime-writable, so a
# read-only mount there fails with EROFS the moment either CLI actually
# runs. Both are left as normal, VM-local, writable directories instead.
# What those mounts were actually carrying -- the Claude Code long-lived
# auth token, and the dotfiles-managed skills/subagents -- is forwarded a
# different way: pj-sbx-spawn exports CLAUDE_CODE_OAUTH_TOKEN (read
# from the host's ~/.claude/sandbox-oauth-token, forwarded the same way as
# the gh token below), and the guest bootstrap runs this repo's own
# dotfiles-sync-agents against the read-only ~/dotfiles mount below, same
# as it would on the host.
#
# This dotfiles repo itself is also mounted read-only, so pj-sbx-spawn
# can bootstrap the same zsh aliases/functions inside the VM as on the
# host, without giving the guest write access back to the host checkout.
#
# The spawning repo's real git directory (__SANDBOX_REPO_GITDIR__) is also
# mounted, read-write, at the identical absolute host path -- a linked
# worktree's `.git` is a *file* containing `gitdir: <that same absolute
# host path>/worktrees/<name>`, baked in by `git worktree add` at creation
# time. Without this mount, that reference is unreachable and every git
# command inside /workspace fails outright (confirmed directly against a
# real spawned sandbox -- see sandbox/lib/task.sh's
# sandbox_render_lima_config doc comment). Read-write because git commands
# that actually run inside the worktree (commit, checkout, merge) write
# into this shared object/ref store, not just into /workspace itself.
#
# pj-sbx-spawn renders this file per task via
# sandbox_render_lima_config (sandbox/lib/task.sh), substituting
# __SANDBOX_SSH_PORT__, __SANDBOX_WORKTREE_PATH__,
# __SANDBOX_DOTFILES_PATH__, and __SANDBOX_REPO_GITDIR__, and appending an
# AWS_PROFILE passthrough stanza, then runs `limactl start` on the result.
#
# __SANDBOX_PORT_FORWARDS__ (issue 005) is spliced the same way as
# __SANDBOX_BASE_PROVISION__ below: a whole `portForwards:` YAML block for
# the spawn's `--ports <comma-separated-list>` value, one dynamically-
# allocated host port per listed guest port (sandbox_allocate_ports), or
# nothing at all when `--ports` is omitted -- identical to today's SSH-only
# forwarding.
#
# __SANDBOX_BASE_MOUNTS__ (issue 010, see issues/prd-local-templates.md) is
# spliced the same sed r/d way as __SANDBOX_BASE_PROVISION__ below: a
# directory-shaped `--base` template may supply a `mounts.yaml` fragment
# (sandbox_base_template_mounts_path, sandbox/lib/base_template.sh) of raw
# `- location: ...` / `mountPoint: ...` / `writable: ...` list items,
# inserted right at this placeholder so they become additional entries in
# the same `mounts:` list below -- or nothing at all for a flat-file
# template, or a directory template with no `mounts.yaml`.

minimumLimaVersion: 2.0.0

base:
- template:_images/ubuntu-lts

memory: "6GiB"

ssh:
  localPort: __SANDBOX_SSH_PORT__

__SANDBOX_PORT_FORWARDS__

mounts:
- location: "__SANDBOX_WORKTREE_PATH__"
  mountPoint: "/workspace"
  writable: true
- location: "~/.config/gh"
  mountPoint: "{{.Home}}/.config/gh"
  writable: false
- location: "~/.aws"
  mountPoint: "{{.Home}}/.aws"
  writable: false
- location: "__SANDBOX_DOTFILES_PATH__"
  mountPoint: "{{.Home}}/dotfiles"
  writable: false
- location: "__SANDBOX_REPO_GITDIR__"
  mountPoint: "__SANDBOX_REPO_GITDIR__"
  writable: true
__SANDBOX_BASE_MOUNTS__

# Docker, Node/npm, git-lfs, and the Claude Code/GitHub CLI/GitHub Copilot
# CLIs, unconditionally (issue 008: "Docker itself is available inside
# every spawned VM" -- extended here to the three agent-facing CLIs and to
# git-lfs, since without them the ~/.config/gh credential mount and the
# forwarded GH_TOKEN/CLAUDE_CODE_OAUTH_TOKEN env vars have nothing
# installed to use them, and any repo checked out under /workspace with
# LFS-tracked objects would otherwise leave those objects as unresolved
# pointer files). Runs on every boot as root (mode: system), guarded by
# `command -v` checks so re-boots of an already-provisioned VM are a cheap
# no-op; installing as root here (rather than via sudo from the regular
# user) lands both npm globals under /usr, on every user's PATH, and
# `git lfs install --system` under /etc, for every user rather than just
# the one running it.
#
# The npm global prefix is chowned to the guest user at the end (rather
# than left root-owned) because `claude`/`copilot` run as that regular
# user, not root: their own built-in auto-updaters rewrite files under
# that same prefix, and root ownership makes that fail with npm's
# `no_permissions` (confirmed via `claude doctor` against a real spawned
# sandbox). Sandboxes are single-guest-user VMs, so handing the one user
# write access to a root-installed, PATH-wide npm prefix has no meaningful
# security downside here.
provision:
- mode: system
  script: |
    #!/bin/sh
    set -eux
    if ! command -v docker >/dev/null 2>&1; then
      curl -fsSL https://get.docker.com | sh
    fi
    usermod -aG docker {{.User}}

    if ! command -v node >/dev/null 2>&1; then
      apt-get update
      apt-get install -y nodejs npm
    fi

    if ! command -v claude >/dev/null 2>&1; then
      npm install -g @anthropic-ai/claude-code
    fi

    if ! command -v copilot >/dev/null 2>&1; then
      npm install -g @github/copilot
    fi

    if ! command -v gh >/dev/null 2>&1; then
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg
      chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
      apt-get update
      apt-get install -y gh
    fi

    if ! command -v git-lfs >/dev/null 2>&1; then
      apt-get update
      apt-get install -y git-lfs
    fi
    git lfs install --system

    npm_prefix="$(npm config get prefix)"
    chown -R {{.User}}:"$(id -gn {{.User}})" "$npm_prefix/lib/node_modules" "$npm_prefix/bin" 2>/dev/null || true
# The spawn's `--base <name>` provisioning (issue 003), spliced in here by
# sandbox_render_lima_config: a second `provision:` list item (its own
# `- mode: system` / `script: |` ...) from sandbox/templates/<name>, or
# nothing at all for `--base none`. Must sit at this exact column-0
# position -- the same indentation a new top-level `provision:` list item
# would have -- since sed's `r`/`d` splice (task.sh) inserts the template
# file's raw content in place of this line without reindenting it.
__SANDBOX_BASE_PROVISION__
